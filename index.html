<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiu's Data Dreamhouse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Quicksand', sans-serif; overflow: hidden; touch-action: none; }
        /* Isometric Base Classes */
        .iso-container { transform: rotateX(60deg) rotateZ(-45deg); transform-style: preserve-3d; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Custom Animations */
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .floating { animation: float 4s ease-in-out infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- DATA & ASSETS ---
        const CARDS = [
            { id: 1, name: "Bayesian Brown Cat", type: "Logic/Fluff", desc: "Posterior probability of being cute is 100%.", emoji: "🐱" },
            { id: 2, name: "Gradient Descent Capy", type: "Math/Chill", desc: "Finding the local minimum of stress.", emoji: "🥔" },
            { id: 3, name: "Joe Gold-bird", type: "Thriller", desc: "He’s just protecting you... from the bushes.", emoji: "🐦" },
            { id: 4, name: "The Panda Tea House", type: "Building", desc: "Loz Block Set #1432. Requires assembly.", emoji: "🎋" },
            { id: 5, name: "Ravioli Bowl", type: "Food", desc: "Kiu's comfort fuel.", emoji: "🥟" },
            { id: 6, name: "Sunset Lamp", type: "Decor", desc: "Aesthetic vibes only.", emoji: "🌅" }
        ];

        const FIBONACCI_SEQ = [1, 1, 2, 3, 5, 8, 13, 21];

        // --- MAIN APP ---
        const App = () => {
            const [started, setStarted] = useState(false);
            const [mood, setMood] = useState("neutral"); // tired, sad, happy, neutral
            const [isWetRat, setIsWetRat] = useState(false);
            const [view, setView] = useState("apartment"); // apartment, garden, cards
            const [dataCubes, setDataCubes] = useState(0);
            const [collection, setCollection] = useState([]);
            const [notification, setNotification] = useState("");
            const [showMail, setShowMail] = useState(false);

            // Audio Refs (Placeholder logic for sound)
            const playPop = () => { /* In a real build, audio.play() goes here */ };

            // Notification Helper
            const notify = (text) => {
                setNotification(text);
                setTimeout(() => setNotification(""), 3000);
            };

            // Unlock Card Logic
            const pullCard = () => {
                if (dataCubes < 15) {
                    notify("Need 15 Data Cubes! Do some math! 📉");
                    return;
                }
                setDataCubes(prev => prev - 15);
                const card = CARDS[Math.floor(Math.random() * CARDS.length)];
                setCollection(prev => [...prev, card]);
                notify(`Weasel Postman brought: ${card.name}!`);
            };

            // Dynamic Styling based on state
            const getBg = () => {
                if (isWetRat) return "bg-gray-900";
                if (mood === "tired") return "bg-indigo-950";
                if (mood === "sad") return "bg-blue-100";
                return "bg-pink-50"; 
            };

            // Intro Screen (Emotional Check-in)
            if (!started) {
                return (
                    <div className="h-screen w-screen bg-pink-100 flex flex-col items-center justify-center p-6 text-center">
                        <motion.div initial={{scale: 0.8, opacity:0}} animate={{scale:1, opacity:1}} className="bg-white p-8 rounded-3xl shadow-xl max-w-md">
                            <h1 className="text-2xl font-bold text-gray-700 mb-2">Welcome Home, Kiu 💕</h1>
                            <p className="text-gray-500 mb-6">How is the weather inside today?</p>
                            <div className="grid grid-cols-2 gap-4">
                                <button onClick={() => {setMood("tired"); setStarted(true);}} className="p-4 bg-indigo-100 rounded-xl hover:bg-indigo-200 transition">😴 Tired</button>
                                <button onClick={() => {setMood("sad"); setStarted(true);}} className="p-4 bg-blue-100 rounded-xl hover:bg-blue-200 transition">🌧️ Sad</button>
                                <button onClick={() => {setMood("happy"); setStarted(true);}} className="p-4 bg-yellow-100 rounded-xl hover:bg-yellow-200 transition">✨ Productive</button>
                                <button onClick={() => {setMood("neutral"); setStarted(true);}} className="p-4 bg-pink-100 rounded-xl hover:bg-pink-200 transition">😐 Just Vibing</button>
                            </div>
                        </motion.div>
                    </div>
                );
            }

            return (
                <div className={`h-screen w-screen transition-colors duration-1000 overflow-hidden relative flex flex-col ${getBg()}`}>
                    
                    {/* TOP HUD */}
                    <div className="absolute top-0 left-0 w-full p-4 z-50 flex justify-between items-start pointer-events-none">
                        <div className="bg-white/80 backdrop-blur pointer-events-auto px-4 py-2 rounded-full shadow-lg font-bold text-pink-600 border-2 border-pink-100 flex items-center gap-2">
                            🧊 {dataCubes} <span className="text-xs text-gray-500">Data Cubes</span>
                        </div>
                        
                        {/* WET RAT TOGGLE (Hidden in a toilet/gear icon usually, but top right for ease) */}
                        <motion.button 
                            whileTap={{ scale: 0.9 }}
                            onClick={() => setIsWetRat(!isWetRat)}
                            className="pointer-events-auto bg-white/80 p-3 rounded-full shadow-lg text-2xl"
                            title="Toggle Wet Rat Mode"
                        >
                            {isWetRat ? "🛁" : "🐀"}
                        </motion.button>
                    </div>

                    {/* NOTIFICATIONS */}
                    <AnimatePresence>
                        {notification && (
                            <motion.div 
                                initial={{ y: -50, opacity: 0 }}
                                animate={{ y: 20, opacity: 1 }}
                                exit={{ y: -50, opacity: 0 }}
                                className="absolute top-16 left-0 right-0 mx-auto w-max z-50 bg-white px-6 py-2 rounded-full shadow-xl border-2 border-pink-300 font-bold text-gray-700"
                            >
                                {notification}
                            </motion.div>
                        )}
                    </AnimatePresence>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 relative w-full h-full">
                        {/* VIEW: APARTMENT (Home) */}
                        {view === 'apartment' && (
                            <ApartmentView isWetRat={isWetRat} mood={mood} onInteract={() => setDataCubes(p => p + 1)} />
                        )}

                        {/* VIEW: GARDEN (Math Games) */}
                        {view === 'garden' && (
                            <GardenView onWin={(amt) => { setDataCubes(p => p + amt); notify(`Harvested ${amt} Data!`); }} />
                        )}

                        {/* VIEW: CARDS (Collection) */}
                        {view === 'cards' && (
                            <CollectionView collection={collection} onPull={pullCard} />
                        )}
                    </main>

                    {/* MAILBOX MODAL */}
                    {showMail && (
                        <div className="absolute inset-0 z-50 bg-black/50 flex items-center justify-center p-4" onClick={() => setShowMail(false)}>
                            <motion.div 
                                initial={{ scale: 0.5 }} animate={{ scale: 1 }}
                                className="bg-white p-8 rounded-2xl max-w-sm w-full relative rotate-1 shadow-2xl"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="absolute top-0 left-0 w-full h-4 bg-red-300/50"></div>
                                <h2 className="font-handwriting text-2xl font-bold mb-4 text-gray-700">Dear Kiu,</h2>
                                <p className="font-handwriting text-gray-600 leading-relaxed mb-4">
                                    Just wanted to remind you that you're doing great. Whether you're feeling like a data scientist princess or a little wet rat, I'm here for you. <br/><br/>
                                    Hope this little digital home gives you some cozy vibes. <br/>
                                    P.S. I'm keeping my Pokemon cards though.
                                </p>
                                <p className="text-right font-bold text-pink-500">- Your Bestie Gugac:</p>
                            </motion.div>
                        </div>
                    )}

                    {/* BOTTOM NAV BAR */}
                    <nav className="absolute bottom-6 left-0 right-0 mx-auto w-[90%] max-w-md bg-white/90 backdrop-blur-xl rounded-2xl p-2 shadow-2xl border border-white/50 flex justify-around z-50">
                        <NavBtn active={view==='apartment'} icon="🏠" label="Home" onClick={() => setView('apartment')} />
                        <NavBtn active={view==='garden'} icon="🌿" label="Math Garden" onClick={() => setView('garden')} />
                        <NavBtn active={view==='cards'} icon="🃏" label="Binder" onClick={() => setView('cards')} />
                        <div className="w-px h-10 bg-gray-200 mx-2"></div>
                        <NavBtn active={false} icon="📬" label="Note" onClick={() => setShowMail(true)} />
                    </nav>

                </div>
            );
        };

        // --- SUB VIEWS ---

        // 1. APARTMENT VIEW (The Visual Core)
        const ApartmentView = ({ isWetRat, mood, onInteract }) => {
            return (
                <div className="w-full h-full flex items-center justify-center overflow-hidden relative">
                    {/* Background City/Garden Toggle Visual */}
                    <div className={`absolute inset-0 transition-all duration-1000 ${isWetRat ? 'bg-gray-800' : 'bg-gradient-to-b from-pink-200 to-white'}`}>
                        {!isWetRat && <div className="absolute top-20 right-20 text-6xl opacity-20 floating">☁️</div>}
                        {!isWetRat && <div className="absolute top-40 left-10 text-4xl opacity-20 floating" style={{animationDelay: '1s'}}>☁️</div>}
                    </div>

                    {/* The Isometric Room */}
                    <motion.div 
                        initial={{ scale: 0.8, opacity: 0 }}
                        animate={{ scale: 1, opacity: 1 }}
                        className="relative w-64 h-64 md:w-80 md:h-80 bg-white rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.1)] border-8 border-white flex flex-col items-center justify-center z-10"
                        style={{
                            boxShadow: isWetRat ? "0 0 50px #4ade80" : "0 20px 60px rgba(255, 192, 203, 0.4)"
                        }}
                    >
                        {/* Floor Texture */}
                        <div className={`absolute inset-2 rounded-2xl opacity-20 ${isWetRat ? 'bg-green-900' : 'bg-pink-100'}`} 
                             style={{backgroundImage: 'radial-gradient(#cea0aa 1px, transparent 1px)', backgroundSize: '10px 10px'}}></div>
                        
                        {/* The Character */}
                        <motion.div 
                            className="text-[80px] z-20 cursor-pointer relative"
                            whileHover={{ scale: 1.1 }}
                            whileTap={{ scale: 0.9, rotate: 10 }}
                            onClick={onInteract}
                        >
                            {isWetRat ? "🐀" : "👸🏻"}
                            {/* Clothes/Accessories */}
                            {!isWetRat && <div className="absolute bottom-0 left-0 w-full text-center text-4xl pointer-events-none transform translate-y-2">🩰</div>}
                            {isWetRat && <div className="absolute -top-4 right-0 text-3xl animate-bounce">💧</div>}
                        </motion.div>

                        {/* Room Items */}
                        <div className="absolute bottom-4 left-4 text-4xl cursor-pointer hover:scale-110 transition" onClick={onInteract} title="Refill Ravioli">
                            {isWetRat ? "🗑️" : "🥟"}
                        </div>
                        <div className="absolute top-4 right-4 text-4xl hover:rotate-12 transition cursor-pointer" title="Loz Blocks">
                            {isWetRat ? "🍕" : "🎋"}
                        </div>
                        <div className="absolute top-4 left-4 text-4xl animate-pulse" title="Sunset Lamp">
                            {isWetRat ? "🔦" : "🌅"}
                        </div>

                        {/* Speech Bubble */}
                        <div className="absolute -top-12 bg-white px-3 py-1 rounded-lg text-xs font-bold shadow border border-pink-100 animate-bounce">
                            {isWetRat ? "Sewer life..." : "So cozy!"}
                        </div>
                    </motion.div>

                    {/* Lighting Overlay */}
                    <div className={`absolute inset-0 pointer-events-none mix-blend-overlay ${mood === 'tired' ? 'bg-blue-900/40' : 'bg-orange-500/0'}`}></div>
                </div>
            );
        };

        // 2. GARDEN VIEW (Math Games)
        const GardenView = ({ onWin }) => {
            const [game, setGame] = useState('fibonacci'); // fibonacci or regression
            const [fibIndex, setFibIndex] = useState(0);
            
            // Regression Game State
            const [stars, setStars] = useState(Array.from({length: 5}, () => ({x: Math.random()*80 + 10, y: Math.random()*80 + 10})));
            const [lineDrawn, setLineDrawn] = useState(false);

            const handleFibClick = (val) => {
                if (val === FIBONACCI_SEQ[fibIndex]) {
                    if (fibIndex === FIBONACCI_SEQ.length - 1) {
                        onWin(10);
                        setFibIndex(0); // Reset
                    } else {
                        setFibIndex(p => p + 1);
                    }
                } else {
                    setFibIndex(0); // Mistake resets
                }
            };

            const solveRegression = () => {
                setLineDrawn(true);
                setTimeout(() => {
                    onWin(15);
                    setLineDrawn(false);
                    setStars(Array.from({length: 5}, () => ({x: Math.random()*80 + 10, y: Math.random()*80 + 10})));
                }, 1500);
            };

            return (
                <div className="w-full h-full p-6 pt-20 flex flex-col items-center">
                    <div className="flex gap-4 mb-6">
                        <button onClick={() => setGame('fibonacci')} className={`px-4 py-2 rounded-full font-bold ${game==='fibonacci' ? 'bg-pink-500 text-white' : 'bg-white text-gray-500'}`}>Fibonacci 🌻</button>
                        <button onClick={() => setGame('regression')} className={`px-4 py-2 rounded-full font-bold ${game==='regression' ? 'bg-blue-500 text-white' : 'bg-white text-gray-500'}`}>Regression 📉</button>
                    </div>

                    {game === 'fibonacci' && (
                        <div className="bg-white/50 backdrop-blur rounded-3xl p-6 w-full max-w-md shadow-xl text-center">
                            <h3 className="text-gray-600 mb-4 font-bold">Click the sequence order!</h3>
                            <p className="mb-4 text-2xl font-mono text-pink-600">{FIBONACCI_SEQ.slice(0, fibIndex).join(", ")}...</p>
                            <div className="grid grid-cols-4 gap-4">
                                {[1, 2, 3, 5, 8, 13, 21, 1].sort(() => Math.random() - 0.5).map((num, i) => (
                                    <motion.button 
                                        key={i}
                                        whileTap={{ scale: 0.9 }}
                                        onClick={() => handleFibClick(num)}
                                        className="bg-pink-200 text-pink-800 w-12 h-12 rounded-full font-bold shadow-md hover:bg-pink-300"
                                    >
                                        {num}
                                    </motion.button>
                                ))}
                            </div>
                        </div>
                    )}

                    {game === 'regression' && (
                        <div className="bg-indigo-900 rounded-3xl p-4 w-full max-w-md shadow-xl aspect-square relative overflow-hidden">
                            <h3 className="text-white/50 text-center mb-2 text-xs">Find the line of best fit to summon Capybara</h3>
                            {stars.map((s, i) => (
                                <div key={i} className="absolute w-2 h-2 bg-yellow-200 rounded-full shadow-[0_0_10px_white]" style={{left: `${s.x}%`, top: `${s.y}%`}}></div>
                            ))}
                            {lineDrawn && (
                                <motion.div 
                                    initial={{ width: 0 }} animate={{ width: "100%" }} 
                                    className="absolute top-1/2 left-0 h-1 bg-red-400 rotate-12 origin-left"
                                ></motion.div>
                            )}
                             {lineDrawn && (
                                <motion.div 
                                    initial={{ scale: 0 }} animate={{ scale: 1 }} 
                                    className="absolute inset-0 flex items-center justify-center text-6xl"
                                >
                                    🥔
                                </motion.div>
                            )}
                            <button onClick={solveRegression} className="absolute bottom-4 left-0 right-0 mx-auto w-32 bg-white text-indigo-900 font-bold py-1 rounded-full shadow-lg">Fit Line</button>
                        </div>
                    )}
                </div>
            );
        };

        // 3. COLLECTION VIEW
        const CollectionView = ({ collection, onPull }) => {
            return (
                <div className="w-full h-full p-6 pt-20 overflow-y-auto pb-32">
                    <div className="text-center mb-8">
                        <motion.button 
                            whileHover={{ scale: 1.05 }}
                            whileTap={{ scale: 0.95 }}
                            onClick={onPull}
                            className="bg-gradient-to-r from-pink-500 to-purple-500 text-white text-lg font-bold py-3 px-8 rounded-2xl shadow-xl border-b-4 border-purple-700"
                        >
                            Open Pack (15 🧊)
                        </motion.button>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                        {collection.map((card, idx) => (
                            <motion.div 
                                key={idx}
                                initial={{ scale: 0 }} animate={{ scale: 1 }}
                                className="bg-white p-3 rounded-xl shadow-md border-2 border-gray-100 flex flex-col items-center text-center relative overflow-hidden"
                            >
                                <div className="absolute top-0 right-0 bg-yellow-200 text-[10px] font-bold px-2 py-1 rounded-bl-lg">{card.type}</div>
                                <div className="text-5xl mb-2">{card.emoji}</div>
                                <h4 className="font-bold text-gray-800 text-sm">{card.name}</h4>
                                <p className="text-[10px] text-gray-500 mt-1">{card.desc}</p>
                            </motion.div>
                        ))}
                        {collection.length === 0 && (
                            <div className="col-span-2 text-center text-gray-400 py-10">
                                No cards yet. The Weasel Postman is waiting!
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- SHARED COMPONENTS ---
        const NavBtn = ({ active, icon, label, onClick }) => (
            <button onClick={onClick} className={`flex flex-col items-center transition ${active ? 'opacity-100 scale-110' : 'opacity-50'}`}>
                <span className="text-2xl">{icon}</span>
                <span className="text-[10px] font-bold">{label}</span>
            </button>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
